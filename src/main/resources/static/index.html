<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexvia - Dashboard Administrativo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #0d6efd; }
        .card-header { background-color: #e9ecef; font-weight: bold; }
        .badge-alta { background-color: #dc3545; } /* Rojo */
        .badge-media { background-color: #ffc107; color: black; } /* Amarillo */
        .badge-baja { background-color: #198754; } /* Verde */
        .badge-critica { background-color: #212529; } /* Negro */
    </style>
</head>
<body>

<!-- Menú de Navegación -->
<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">
            <strong>🎫 Nexvia</strong> | Dashboard Administrativo
        </a>
    </div>
</nav>

<div class="container">
    <!-- Tarjeta Principal -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Lista de Reclamos y Tickets</span>
            <button class="btn btn-sm btn-primary" onclick="cargarTickets()">🔄 Actualizar Datos</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID / Código</th>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Usuario</th>
                        <th>Responsable</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-tickets-body">
                    <tr>
                        <td colspan="7" class="text-center text-muted">Cargando tickets...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Script para conectar con el Backend (Spring Boot) -->
<script>
    // Ajusta esta URL si tu controlador tiene un @RequestMapping diferente (ej: '/api/tickets')
    const API_URL = '/api/tickets';

    // Función principal para obtener los datos
    async function cargarTickets() {
        const tbody = document.getElementById('tabla-tickets-body');

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error('Error al conectar con la API');
            }

            const tickets = await response.json();
            tbody.innerHTML = ''; // Limpiar la tabla

            if (tickets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No hay tickets registrados.</td></tr>';
                return;
            }

            // Recorrer los tickets y agregarlos a la tabla
            tickets.forEach(ticket => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                        <td><strong>${ticket.id}</strong> <br> <small class="text-muted">${ticket.codigo || 'S/C'}</small></td>
                        <td>${ticket.titulo}</td>
                        <td>${ticket.categoria || 'Sin Categoría'}</td>
                        <td>${ticket.usuario || 'Desconocido'}</td>
                        <td>${ticket.responsable || 'Sin asignar'}</td>
                        <td>${obtenerBadgePrioridad(ticket.prioridad)}</td>
                        <td><span class="badge bg-secondary">${ticket.estado}</span></td>
                    `;
                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">⚠️ Error al cargar los datos. Verifica que el backend esté corriendo.</td></tr>`;
        }
    }

    // Función para darle color a la prioridad según el Patrón Strategy
    function obtenerBadgePrioridad(prioridad) {
        if (!prioridad) return '<span class="badge bg-light text-dark">N/A</span>';

        const p = prioridad.toUpperCase();
        if (p === 'CRITICA') return `<span class="badge badge-critica">${prioridad}</span>`;
        if (p === 'ALTA') return `<span class="badge badge-alta">${prioridad}</span>`;
        if (p === 'MEDIA') return `<span class="badge badge-media">${prioridad}</span>`;
        if (p === 'BAJA') return `<span class="badge badge-baja">${prioridad}</span>`;

        return `<span class="badge bg-info">${prioridad}</span>`;
    }

    // Cargar los tickets automáticamente cuando se abre la página
    document.addEventListener("DOMContentLoaded", cargarTickets);
</script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
